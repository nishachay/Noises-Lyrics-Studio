name: Cloud Video Render

on:
  repository_dispatch:
    types: [cloud-export]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Dependencies
        run: npm install

      - name: Download Project Files
        run: |
          mkdir -p temp
          echo "Downloading Audio from file.io..."
          curl -L -o temp/audio.mp3 "${{ github.event.client_payload.audioUrl }}"
          echo "Downloading JSON from file.io..."
          curl -L -o temp/project.json "${{ github.event.client_payload.jsonUrl }}"

      - name: Setup YouTube Credentials
        run: |
          echo '${{ secrets.YOUTUBE_OAUTH_JSON }}' > youtube_auth.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > youtube_client_secret.json

      - name: Render and Upload
        run: node run-cloud.js temp/project.json temp/audio.mp3
