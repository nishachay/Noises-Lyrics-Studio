name: Cloud Video Render
run-name: Render [${{ github.event.action }}]

on:
  repository_dispatch:
    types: 
      - cloud-export-pop
      - cloud-export-hiphop
      - cloud-export-hindi
      - cloud-export-dhh
      - cloud-export-kpop
      - cloud-export-local
      - cloud-export-unknown

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Download Project Files
        run: |
          mkdir -p temp
          echo "Downloading Audio from file.io..."
          curl -L -o temp/audio.mp3 "${{ github.event.client_payload.audioUrl }}"
          echo "Downloading JSON from file.io..."
          curl -L -o temp/project.json "${{ github.event.client_payload.jsonUrl }}"

      - name: Render and Upload
        run: node run-cloud.js temp/project.json temp/audio.mp3
